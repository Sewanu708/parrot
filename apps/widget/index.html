<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parrot Widget — Local Testbed</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 40px;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        color: #475569;
        line-height: 1.6;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      button {
        background: #4f46e5;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #4338ca;
      }
      button.secondary {
        background: #e2e8f0;
        color: #1e293b;
      }
      button.secondary:hover {
        background: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🦜 Parrot Widget Dev Harness</h1>
      <p>
        Testing the V2 host SDK (<code>parrot.js</code>) and isolated iframe embed (<code>embed.html</code>)
        in local development with Vite HMR.
      </p>
      <div class="btn-group">
        <button id="open-btn">Open Chat</button>
        <button id="close-btn" class="secondary">Close Chat</button>
        <button id="identify-btn">Identify User</button>
        <button id="reset-btn" class="secondary">Reset Session</button>
      </div>
    </div>

    <!-- Load Host SDK directly in dev mode -->
    <script type="module" src="/src/parrot.ts"></script>
    <script type="module">
      const parrot = new window.Parrot({
        propertyId: "d5646386-c2ab-4d02-b9f2-cc04273b15b6",
        user: {
          name: "Test Visitor",
          email: "visitor@example.com",
          custom: {
            plan: "Pro"
          }
        }
      });

      document.getElementById("open-btn").addEventListener("click", () => parrot.open());
      document.getElementById("close-btn").addEventListener("click", () => parrot.close());
      document.getElementById("identify-btn").addEventListener("click", () => {
        parrot.identify({
          name: "Alex Johnson",
          email: "alex@acme.com",
          phone: "+1 555-0199",
          custom: { plan: "Enterprise" }
        });
        alert("Identified user as Alex Johnson");
      });
      document.getElementById("reset-btn").addEventListener("click", () => {
        parrot.reset();
        alert("Session reset");
      });
    </script>
  </body>
</html>
